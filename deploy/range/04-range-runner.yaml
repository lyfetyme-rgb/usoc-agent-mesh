apiVersion: apps/v1
kind: Deployment
metadata:
  name: range-runner
  namespace: usoc-range
spec:
  replicas: 1
  selector:
    matchLabels:
      app: range-runner
  template:
    metadata:
      labels:
        app: range-runner
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: registry.invalid/usoc-range:not-built
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-scratch
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp-scratch
          emptyDir: {}
