apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Isolated pre-production namespace. The Namespace name and the dashboard's
# DNS-rebinding allowlist must both follow the overlay namespace; Kustomize's
# namespace transformer changes metadata.namespace but not string values.
namespace: usoc-staging

resources:
  - ../../base

patches:
  - target:
      version: v1
      kind: Namespace
      name: usoc-prod
    patch: |-
      - op: replace
        path: /metadata/name
        value: usoc-staging
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: usoc-dashboard-proxy
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/5/value
        value: "usoc-dashboard,usoc-dashboard.usoc-staging.svc.cluster.local,localhost,127.0.0.1"
