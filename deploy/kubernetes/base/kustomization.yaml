apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 02-configmap.yaml
  - 03-storage.yaml
  - 06-rbac.yaml
  - 10-control-plane.yaml
  - 11-workers.yaml
  - 12-doctor-job.yaml
  - 20-network-policies.yaml
  - 21-admission-policy.yaml
  - 22-seraphim-quarantine.yaml
  - 23-workload-identity.yaml
  - 30-dashboard-proxy.yaml

# 01-secrets.example.yaml.example and 31-ingress.yaml.example are templates and
# are intentionally not resources: `kubectl apply -k` must never create a
# usable-looking Secret or an unauthenticated public Ingress.
