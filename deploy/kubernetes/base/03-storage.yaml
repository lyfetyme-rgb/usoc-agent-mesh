# The production topology is intentionally stateless: there is no RWX PVC.
#
# Approvals, OEKP evidence and the task ledger live in tenant-partitioned
# Postgres; Redis is a short-lived hot cache; the signed redacted ledger chain
# is archived to S3 Object Lock (WORM). Control-plane and worker pods therefore
# need only a per-pod /tmp emptyDir. This ConfigMap exists so `kubectl apply -k
# deploy/kubernetes` remains a deterministic, ordered operation and so the
# policy is visible to operators auditing the manifests.
apiVersion: v1
kind: ConfigMap
metadata:
  name: usoc-mesh-storage-policy
  namespace: usoc-prod
  labels:
    app.kubernetes.io/part-of: usoc-mesh
data:
  policy: "stateless-control-plane"
  durable-store: "postgresql://<managed Postgres> (tenant-partitioned approvals, OEKP evidence and task ledger)"
  hot-cache: "external Redis/Valkey with TLS + AUTH"
  worm-archive: "S3 Object Lock, COMPLIANCE mode, AES256 SSE"
