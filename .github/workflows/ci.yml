name: CI

on:
  push:
    branches: [main, dev, production]
  pull_request:
    branches: [main, dev, production]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -q
      - name: Doctor (offline)
        run: python -m agents doctor
      - name: Offline vertical storyboards
        run: |
          python -m agents storyboard --vertical cyber > /dev/null
          python -m agents storyboard --vertical finance > /dev/null
          python -m agents storyboard --vertical healthcare > /dev/null
