name: CI

on:
  push:
    branches: [main, dev, production]
  pull_request:
    branches: [main, dev, production]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Submodule drift check
        run: |
          set -euo pipefail
          recorded=$(git ls-tree HEAD h-lift | awk '{print $3}')
          remote=$(git ls-remote https://github.com/lyfetyme-rgb/h-lift.git refs/heads/main | awk '{print $1}')
          echo "h-lift recorded=$recorded"
          echo "h-lift main  =$remote"
          status=$(git submodule status h-lift)
          case "$status" in
            +*|-*|U*)
              echo "::error::h-lift submodule pointer is not clean in this tree: $status"
              exit 1
              ;;
          esac
          if [ "$recorded" != "$remote" ]; then
            if [ "${GITHUB_REF_NAME:-}" = "main" ]; then
              echo "::error::h-lift pointer ($recorded) is not h-lift main ($remote). Update it with: git add h-lift && git commit"
              exit 1
            fi
            echo "::warning::h-lift pointer ($recorded) lags h-lift main ($remote) on ${GITHUB_REF_NAME}; allowed off main"
          fi
      - name: Run test suite
        run: python -m pytest -q
      - name: Doctor (offline)
        run: python -m agents doctor
      - name: Offline vertical storyboards
        run: |
          python -m agents storyboard --vertical cyber > /dev/null
          python -m agents storyboard --vertical finance > /dev/null
          python -m agents storyboard --vertical healthcare > /dev/null
      - name: Offline LLM rehearsal (zero egress)
        run: python -m agents --workspace workspace/rehearsal-ci llm-rehearsal > /dev/null

  traceability:
    name: traceability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install pyyaml
      - name: Validate requirement catalog
        run: python toolbox/scripts/traceability_check.py

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install scanners
        run: python -m pip install --upgrade pip && python -m pip install pip-audit bandit
      - name: Dependency vulnerability audit
        run: python -m pip_audit . --progress-spinner off
      - name: SAST (Bandit)
        run: python -m bandit -r agents -ll -q -c toolbox/security/bandit.yaml
      - name: Secret scan (Gitleaks)
        run: |
          set -euo pipefail
          go install github.com/gitleaks/gitleaks/v8@latest
          "$(go env GOPATH)/bin/gitleaks" detect --source . --no-git --redact --exit-code 1
      - name: Filesystem vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
