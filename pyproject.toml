[project]
name = "agent-mesh"
version = "0.2.0"
description = "USOC: nine governed subsystem agents on a typed message bus"
license = "BUSL-1.1"
license-files = ["LICENSE", "LICENSE.ELASTIC-2.0"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "redis>=5.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
# Optional production backends. The core mesh stays dependency-light; both
# drivers are imported lazily and can be replaced with injected adapters.
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]

[project.scripts]
agents = "agents.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
