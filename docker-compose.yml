name: usoc-mesh

# Run with:
#   docker compose --env-file .env.docker up -d --build
# Secrets are files, not environment variables:
#   ./secrets/agent_shared_secret.txt
#   ./secrets/health_token.txt
# See SECURITY.md for generation commands and the deployment checklist.

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.docker}
      - --appendonly
      - "yes"
      - --save
      - ""
    environment:
      # Keeps the password off the redis-cli command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  mesh:
    build: .
    image: usoc-mesh:local
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      AGENT_BUS: redis
      AGENT_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.docker}@redis:6379/0
      AGENT_SHARED_SECRET_FILE: /run/secrets/agent_shared_secret
      AGENT_HEALTH_TOKEN_FILE: /run/secrets/health_token
      AGENT_HEALTH_HOST: 0.0.0.0
      AGENT_HEALTH_PORT: "8080"
      # Optional: expose the admin-only /diagnostics route. Mount a separate
      # secret file and keep it distinct from the health token.
      # AGENT_ADMIN_TOKEN_FILE: /run/secrets/admin_token
      # Pin the capability cards; generate with `python -m agents integrity`.
      # AGENT_SUBSYSTEMS_MANIFEST_HASH: ${AGENT_SUBSYSTEMS_MANIFEST_HASH:-}
      # AGENT_REQUIRE_SUBSYSTEMS_INTEGRITY: "true"
      # --- Production trust (AGENT_STRICT_PROD=1) ----------------------------
      # Uncomment as a group after provisioning the files below. Strict mode
      # removes every dev fallback; `python -m agents doctor` must exit 0.
      # Cluster-level approval/evidence signing (independent of bus keys):
      # AGENT_STRICT_PROD: "1"
      # AGENT_SIGNING_MODE: ed25519
      # AGENT_ED25519_PUBLIC_KEYS_FILE: /run/secrets/ed25519_public_keys.json
      # AGENT_ED25519_PRIVATE_KEY_FILE: /run/secrets/ed25519_private.pem
      # Per-coordinator bus identity: this process is `seraphim`. Every node
      # mounts bus_public_keys.json, but ONLY this node mounts seraphim.pem.
      # AGENT_BUS_PUBLIC_KEYS_FILE: /run/secrets/bus_public_keys.json
      # AGENT_BUS_SIGNING_AGENT: seraphim
      # AGENT_BUS_SIGNING_KID: seraphim-1
      # AGENT_BUS_SIGNING_KEY_FILE: /run/secrets/bus_seraphim.pem
      # Signed approver registry + detached/OIDC human credentials:
      # AGENT_APPROVER_REGISTRY_FILE: /run/secrets/approvers.json
      # AGENT_APPROVER_REGISTRY_SIGNATURE_FILE: /run/secrets/approvers.json.sig
      # AGENT_APPROVER_REGISTRY_PUBLIC_KEY_FILE: /run/secrets/approvers_public.hex
      # AGENT_APPROVAL_CREDENTIAL_MODE: either
      # AGENT_APPROVAL_REQUIRE_CREDENTIAL: "1"
      # Fail closed if the deployment forgets to name its approvers.
      AGENT_REQUIRE_APPROVER_ALLOWLIST: "true"
      AGENT_APPROVERS: ${AGENT_APPROVERS:?set AGENT_APPROVERS in .env.docker}
      AGENT_ALLOWED_TARGETS: "${AGENT_ALLOWED_TARGETS:-sandbox/*,staging/*}"
      AGENT_APPROVAL_TTL_S: "${AGENT_APPROVAL_TTL_S:-86400}"
      AGENT_LOG_JSON: "true"
      # Optional: point at a reviewed read-only connectors file mounted below.
      # AGENT_CONNECTORS_FILE: /app/connectors.yaml
    secrets:
      - agent_shared_secret
      - health_token
    volumes:
      - mesh-data:/data
      # Optional fragmentation inputs. Copy connectors.example.yaml to
      # connectors.yaml, review it, then uncomment both mounts:
      # - ./connectors.yaml:/app/connectors.yaml:ro
      # - ./fixtures:/app/fixtures:ro
      # Strict-prod trust files (generated offline, mounted read-only). The
      # private key below belongs to this node's AGENT_BUS_SIGNING_AGENT only:
      # - ./trust/bus_public_keys.json:/run/secrets/bus_public_keys.json:ro
      # - ./secrets/bus_seraphim.pem:/run/secrets/bus_seraphim.pem:ro
      # - ./trust/approvers.json:/run/secrets/approvers.json:ro
      # - ./trust/approvers.json.sig:/run/secrets/approvers.json.sig:ro
      # - ./trust/approvers_public.hex:/run/secrets/approvers_public.hex:ro
      # - ./trust/ed25519_public_keys.json:/run/secrets/ed25519_public_keys.json:ro
      # - ./secrets/ed25519_private.pem:/run/secrets/ed25519_private.pem:ro
    # Keep the read-only health endpoint off every interface by default.
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - internal
      - egress
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # SHELL runs beneath the bus, so cap blast radius even if it is compromised.
    pids_limit: 256
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
    healthcheck:
      test: ["CMD", "python", "-m", "agents", "probe", "--url", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  # Redis is not reachable from outside this network.
  internal:
    internal: true
  # The mesh needs egress only if you point it at a remote model endpoint.
  egress:

volumes:
  redis-data:
  mesh-data:

secrets:
  agent_shared_secret:
    file: ./secrets/agent_shared_secret.txt
  health_token:
    file: ./secrets/health_token.txt

# Strict-prod keys are injected as read-only bind mounts (see `mesh.volumes`)
# rather than Compose secrets so each worker receives only its own identity's
# private key. If you prefer Compose secrets, declare one per coordinator and
# mount that secret ONLY on the matching service.
